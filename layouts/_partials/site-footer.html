<footer class="site-footer w-100 pa3" role="contentinfo">
  <div class="site-footer__inner flex flex-wrap justify-between items-center">
    <a class="site-footer__home f5 pv2 ph3 no-underline" href="{{ .Site.Home.RelPermalink }}">
      &copy; {{ .Site.Title }} {{ now.Format "2006" }}
    </a>
    {{ with .Site.Menus.footer }}
      <ul class="pl0 ma0">
        {{ range . }}
          <li class="list f5 dib ph3">
            <a class="site-footer__link" href="{{ .URL }}">{{ .Name }}</a>
          </li>
        {{ end }}
      </ul>
    {{ end }}
  </div>
</footer>
