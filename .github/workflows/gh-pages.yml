name: github page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.166.0
          extended: true

      - name: Build
        run: hugo --minify

      # Der Deploy ersetzt den gh-pages-Branch vollständig. Damit offene
      # PR-Vorschauen dabei nicht gelöscht werden, werden sie mit übernommen.
      - name: Keep PR previews
        run: |
          if git fetch --depth=1 origin gh-pages && git cat-file -e FETCH_HEAD:pr-preview 2>/dev/null; then
            git archive FETCH_HEAD pr-preview | tar -x -C public
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
