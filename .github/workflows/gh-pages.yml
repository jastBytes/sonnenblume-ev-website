name: github page

on:
  push:
    branches:
      - main
  # Rebuild daily so past events (data/events.yaml) disappear automatically
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.166.0
          extended: true

      - name: Build
        run: hugo --minify

      # The deploy replaces the gh-pages branch completely. Carry over open
      # PR previews so they are not deleted.
      - name: Keep PR previews
        run: |
          if git fetch --depth=1 origin gh-pages && git cat-file -e FETCH_HEAD:pr-preview 2>/dev/null; then
            git archive FETCH_HEAD pr-preview | tar -x -C public
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # Custom domain: rewrite the CNAME file on every deploy, otherwise it would be deleted
          cname: sonnenblume-oberems.de
