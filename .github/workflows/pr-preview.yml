name: pr-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PREVIEW_URL: https://sonnenblume-oberems.de/pr-preview/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Comment preview is being built
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          message: |
            ⏳ **Vorschau wird erstellt …** Bitte noch nicht öffnen, dieser Kommentar wird aktualisiert, sobald sie bereit ist (meist nach 2–4 Minuten).

      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.166.0
          extended: true

      - name: Build
        run: |
          hugo --minify --baseURL "$PREVIEW_URL"
          # Marker for this revision so the next step can tell when it is being served
          echo "${{ github.event.pull_request.head.sha }}" > public/preview-version.txt

      - name: Deploy preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: pr-preview/pr-${{ github.event.pull_request.number }}
          keep_files: true

      # GitHub Pages publishes one to three minutes after the upload.
      # Wait until the preview serves exactly this revision (at most 10 minutes).
      - name: Wait until preview is live
        id: wait
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          for i in $(seq 1 60); do
            served=$(curl -sf "${PREVIEW_URL}preview-version.txt?nocache=$(date +%s)" || true)
            if [ "$served" = "$expected" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Comment preview is ready
        if: steps.wait.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          message: |
            ✅ **Vorschau bereit:** ${{ env.PREVIEW_URL }}

      - name: Comment preview is delayed
        if: steps.wait.outputs.ready != 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          message: |
            ⚠️ **Vorschau braucht länger als üblich.** Bitte in ein paar Minuten öffnen: ${{ env.PREVIEW_URL }}

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          rm -rf "pr-preview/pr-${{ github.event.pull_request.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}"
          git push
