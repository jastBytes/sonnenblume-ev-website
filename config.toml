baseURL = 'https://sonnenblume-oberems.de'
locale = 'de'
title = 'Förderverein Sonnenblume e.V.'
enableEmoji = true
theme = 'ananke'

SectionPagesMenu = "main"
enableRobotsTXT = true

[languages]
[languages.de]
weight = 1
contentDir = "content"

[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

[params]
text_color = "sb-ink"
# Page background and base font (see assets/ananke/css/sonnenblume.css)
body_classes = "avenir sb-body"
# Logo lives in assets/ and is resized automatically for the header and favicon
site_logo = "images/logo.png"
# Preview image when the page is shared (e.g. in messengers)
images = ["images/teilen.jpg"]
description = "Förderverein Sonnenblume e.V. der Ev. Kita Oberems"
# choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
background_color_class = "bg-green"
# Subtitle in the home page header
hero_subtitle = "des evangelischen Kindergartens Oberems"
recent_posts_number = 0

[params.ananke]
# Styling in the style of the club flyer (assets/ananke/css/sonnenblume.css)
custom_css = ["sonnenblume.css"]

# Central club data, used on pages via {{< club "..." >}}
[params.club]
email = "fvsonnenblume.oberems@gmail.com"
address = "c/o Jan Steffen, Hauptstraße 27c, 61479 Glashütten"
# Place to hand in forms in person; not the club's postal address
kindergarten_address = "Ev. Kindergarten Oberems, Heuweg 9, 61479 Glashütten"
account_holder = "Förderverein Sonnenblume e.V."
iban = "DE24 5019 0000 6000 5794 57"
bic = "FFVBDEFF"
bank = "Frankfurter Volksbank"
# Remittance information in the donation QR code
remittance_info = "Spende Förderverein Sonnenblume"
register = "Amtsgericht Königstein VR 1070"

[ananke]
show_recent_posts = false # show recent posts on the homepage
