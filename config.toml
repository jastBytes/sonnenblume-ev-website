baseURL = 'https://sonnenblume-oberems.de'
locale = 'de'
title = 'Förderverein Sonnenblume e.V.'
enableEmoji = true
theme = 'ananke'

SectionPagesMenu = "main"
enableRobotsTXT = true

[languages]
[languages.de]
weight = 1
contentDir = "content"

[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

[params]
text_color = "sb-ink"
# Hintergrund und Grundschrift der Seite (siehe assets/ananke/css/sonnenblume.css)
body_classes = "avenir sb-body"
# Logo liegt unter assets/ und wird für Header und Favicon automatisch verkleinert
site_logo = "images/logo.png"
# Vorschaubild beim Teilen der Seite (z. B. in Messengern)
images = ["images/teilen.jpg"]
description = "Förderverein Sonnenblume e.V. der Ev. Kita Oberems"
# choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
background_color_class = "bg-green"
# Untertitel im Kopfbereich der Startseite
hero_subtitle = "des evangelischen Kindergartens Oberems"
recent_posts_number = 0

[params.ananke]
# Gestaltung im Stil des Flyers (assets/ananke/css/sonnenblume.css)
custom_css = ["sonnenblume.css"]

# Zentrale Vereinsdaten, auf den Seiten per {{< verein "..." >}} eingebunden
[params.verein]
email = "fvsonnenblume.oberems@gmail.com"
anschrift = "c/o Jan Steffen, Hauptstraße 27c, 61479 Glashütten"
# Ort für persönliche Abgabe und Ansprache, keine Postanschrift des Vereins
kindergarten = "Ev. Kindergarten Oberems, Heuweg 9, 61479 Glashütten"
kontoinhaber = "Förderverein Sonnenblume e.V."
iban = "DE24 5019 0000 6000 5794 57"
bic = "FFVBDEFF"
bank = "Frankfurter Volksbank"
# Verwendungszweck im Spenden-QR-Code
verwendungszweck = "Spende Förderverein Sonnenblume"
register = "Amtsgericht Königstein VR 1070"

[ananke]
show_recent_posts = false # show recent posts on the homepage
